<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14121c">
<title>Magic Survival · Spells & fusions</title>
<meta name="description" content="Magic Survival companion: spell attributes, fusions and Ultimas with tiers.">
<style>
:root{color-scheme:dark;--bg:#14121c;--panel:#1d1a29;--panel2:#252135;--line:#3a3450;--muted:#a9a3bf;--ink:#f1eef9;--accent:#b99cff;
--tS:#ff6b6b;--tA:#ff9f43;--tB:#ffd166;--tC:#7bd88f;--tD:#6cb6ff;--tE:#8b87a0;--tX:#5a5470;
--fire:#ff8a5c;--storm:#ffd84d;--nature:#6fd6ff;--energy:#c792ff;--arcane:#f2f2f2;--support:#8be0b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent);text-underline-offset:3px}
button,input{font:inherit;color:inherit}
.shell{max-width:1200px;margin:auto;padding:0 20px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:20px;letter-spacing:.5px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand small{font-weight:500;color:var(--muted);font-size:14px;margin-left:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted)}
nav a.on{background:var(--panel2);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 11px;cursor:pointer;color:var(--muted);font-size:14px}
.seg button.on{background:var(--accent);color:#1a1426;font-weight:700}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 0}
.bar label{color:var(--muted);font-size:14px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
h2{font-size:15px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:26px 0 10px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--el);border-radius:10px;padding:10px 12px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);border-left-color:var(--el);transform:translateY(-1px)}
.card .nm{display:block;font-weight:700;font-size:17px}
.sum{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
.sum span{display:inline-flex;align-items:center;gap:5px}
.t{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 5px;border-radius:5px;font-weight:800;font-size:13px;color:#16121f;background:var(--tE)}
.t.S{background:var(--tS)}.t.A{background:var(--tA)}.t.B{background:var(--tB)}.t.C{background:var(--tC)}.t.D{background:var(--tD)}.t.E{background:var(--tE)}.t.X{background:var(--tX);color:#fff}.t.N{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.t.big{min-width:34px;height:30px;font-size:17px;border-radius:7px}
.ic{display:inline-block;flex:none;object-fit:contain;border-radius:8px;vertical-align:middle}
.ic.xs{width:20px;height:20px;border-radius:4px;margin-right:4px}.ic.sm{width:36px;height:36px}.ic.md{width:48px;height:48px}.ic.lg{width:64px;height:64px;border-radius:12px}
.ic.ph{background:var(--panel2);border:1px dashed var(--line)}
.lnk{display:inline-flex;align-items:center;white-space:nowrap}
.sub{color:var(--muted);font-weight:400;font-size:13px}
.el{width:10px;height:10px;border-radius:50%;background:var(--el);display:inline-block}
/* detail */
.back{display:inline-block;margin:16px 0 0;color:var(--muted);text-decoration:none}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:10px 0 4px}
.head h1{margin:0;font-size:30px}
.verdict{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin:12px 0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 18px;font-size:14px;color:var(--muted);margin:10px 0}
.meta b{color:var(--ink);font-weight:600}
.tree{list-style:none;margin:0;padding:0}
.attr{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:flex-start}
.row .body{flex:1;min-width:0}
.ttl{font-weight:700}
.desc{color:var(--muted);font-size:14px;margin-top:2px}
.kids{list-style:none;margin:10px 0 0 13px;padding:0 0 0 18px;border-left:2px solid var(--line)}
.kids>li{position:relative;padding:8px 0}
.kids>li::before{content:"";position:absolute;left:-18px;top:20px;width:14px;border-top:2px solid var(--line)}
.fx{color:var(--muted);font-size:14px}
.fx a{font-weight:600}
.ult{margin-top:6px;padding:7px 10px;background:var(--panel2);border-radius:8px;font-size:14px}
.ult .lbl{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-right:6px}
.note{font-size:13px;color:var(--muted);font-style:italic}
.none{color:var(--muted);font-size:14px;padding:4px 0}
details{margin-top:4px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
/* tier list */
.tierrow{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;border-bottom:1px solid var(--line);padding:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--el);border-radius:8px;padding:5px 10px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.3}
.chip:hover{border-color:var(--accent);border-left-color:var(--el)}
.chip small{display:block;color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.prose{max-width:760px;color:var(--muted)}
.prose b{color:var(--ink)}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
@media (max-width:600px){.shell{padding:0 14px 40px}.head h1{font-size:24px}.kids{margin-left:6px;padding-left:14px}.kids>li::before{left:-14px;width:10px}}
</style></head>

// ---------- MODEL ----------
const ORDER=['S','A','B','C','D','E','X'];
const rank=t=>t==null?99:ORDER.indexOf(t);
const best=arr=>arr.filter(t=>t!=null).sort((a,b)=>rank(a)-rank(b))[0]||null;
const SP={};SPELLS.forEach(s=>{SP[s.id]=s;s.attrs=s.attrs.map(a=>({id:a[0],en:a[1],tier:a[2],desc:a[3],stage:a[4]||0,alias:a[5]||'',spell:s}));s.A={};s.attrs.forEach(a=>s.A[a.id]=a)});
const FU={};
const ref=r=>{if(r.startsWith('passive:'))return{passive:r.slice(8)};if(r.startsWith('fusion:'))return{fusion:r.slice(7),spell:SP.circle,attr:null};const[s,a]=r.split('.');return{spell:SP[s],attr:SP[s].A[a]}};
const FUS=FUSIONS.map(f=>({id:f[0],en:f[1],tier:f[2],dem:f[3],main:ref(f[4]),sub:ref(f[5]),desc:f[6],note:f[7]||'',var:f[8]||{}}));
FUS.forEach(f=>FU[f.id]=f);
const ULT=ULTS.map(u=>({en:u[0],tier:u[1],dem:u[2],fusion:FU[u[3]],desc:u[4]}));
ULT.forEach(u=>u.fusion.ult=u);
// Icons (Fandom wiki art, resized to 64 px WebP). Fusions newer than the wiki have none.
const NOIMG=new Set(['glacium','soulblade','discharge']);
const PIMG=new Set(['intelligence','fast-casting','vitality','haste','arcane-effuse','concentration','snipe','explorer','lord-of-fire','stormy-clouds','natures-wrath','energy-engineering','arcana','guardian-angel','silent-casting','war-magic','timekeeper','pioneer','smite','seal','curse','chakra','mana-factory','doctor','blood-magic','adrenaline','juggernaut','priest','eldritch','noblesse','taoist']);
const slug=n=>n.toLowerCase().replace(/'/g,'').replace(/[^a-z0-9]+/g,'-');
const img=(src,cls)=>`<img class="ic ${cls||''}" src="${src}" alt="" loading="lazy" width="64" height="64">`;
const blank=cls=>`<span class="ic ${cls||''} ph" aria-hidden="true"></span>`;
const sImg=(s,cls)=>img(`img/s-${s.id}.webp`,cls);
const fImg=(f,cls)=>NOIMG.has(f.id)?blank(cls):img(`img/f-${f.id}.webp`,cls);
const pImg=(n,cls)=>PIMG.has(slug(n))?img(`img/p-${slug(n)}.webp`,cls):blank(cls);

let mode='std';try{mode=localStorage.getItem('ms-mode')||'std'}catch(e){}
const T=x=>mode==='dem'&&x.dem!==undefined?x.dem:x.tier;
const tag=(t,big)=>t==null?`<span class="t N${big?' big':''}" title="Not rated in this list">–</span>`:`<span class="t ${t}${big?' big':''}">${t==='X'?'×':t}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const elv=s=>`--el:var(--${s.el})`;
const spellLink=(s,a)=>`<a class="lnk" href="#/spell/${s.id}">${sImg(s,'xs')}${esc(s.en)}</a>${a?` <span class="sub">(${esc(a.en)})</span>`:''}`;
const refHTML=r=>r.fusion?`<b>${esc(FU[r.fusion].en)}</b>`:r.spell?spellLink(r.spell,r.attr):`<span class="lnk">${pImg(r.passive,'xs')}<b>${esc(r.passive)}</b></span> <span class="sub">(passive)</span>`;
const asMain=s=>FUS.filter(f=>f.main.spell===s);
const asSub=s=>FUS.filter(f=>f.sub.spell===s);
function summary(s){const at=best(s.attrs.map(a=>a.tier));const fm=asMain(s);const ft=best(fm.map(T));const ut=best(fm.filter(f=>f.ult).map(f=>T(f.ult)));return{at,ft,ut,fm}}

// ---------- VIEWS ----------
const app=document.getElementById('app');
function modeSeg(){return `<span class="seg" role="group" aria-label="Tier list"><button data-mode="std" class="${mode==='std'?'on':''}">Standard</button><button data-mode="dem" class="${mode==='dem'?'on':''}">Deus Ex Machina</button></span>`}
let q='';
function viewSpells(){
  const groups=['arcane','fire','storm','nature','energy','support'];
  const match=s=>{if(!q)return true;const n=q.toLowerCase();return [s.en,...s.attrs.flatMap(a=>[a.en,a.alias]),...asMain(s).flatMap(f=>[f.en,f.ult?f.ult.en:''])].some(x=>x&&x.toLowerCase().includes(n))};
  app.innerHTML=`<div class="bar"><label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Spell, attribute, fusion or Ultima" value="${esc(q)}" autocomplete="off"></label><label>Fusion tiers ${modeSeg()}</label></div>
  <p class="note" style="margin:0">Offered a spell? Open it to see its attributes, the fusions it powers up, and the Ultimas behind them. Badges: best <b>attribute</b> · best <b>fusion</b> · best <b>Ultima</b>.</p>
  <div id="list"></div>`;
  const list=document.getElementById('list');
  const draw=()=>{list.innerHTML=groups.map(g=>{const ss=SPELLS.filter(s=>s.el===g&&match(s));if(!ss.length)return'';return `<h2>${EL[g]}</h2><div class="grid">${ss.map(s=>{const m=summary(s);return `<a class="card" style="${elv(s)}" href="#/spell/${s.id}">${sImg(s,'md')}<span><span class="nm">${esc(s.en)}</span><span class="sum"><span>Attr ${tag(m.at)}</span><span>Fusion ${m.fm.length?tag(m.ft):'<span class="note">none</span>'}</span>${m.fm.some(f=>f.ult)?`<span>Ultima ${tag(m.ut)}</span>`:''}</span></span></a>`}).join('')}</div>`}).join('')||'<p class="none">No match.</p>'};
  draw();
  const qi=document.getElementById('q');qi.addEventListener('input',()=>{q=qi.value.trim();draw()});
}
function verdict(s){
  const m=summary(s);const ba=s.attrs.filter(a=>a.tier===m.at).map(a=>a.en).join(' / ');
  const top=m.fm.filter(f=>T(f)===m.ft);const topU=m.fm.filter(f=>f.ult&&T(f.ult)===m.ut);
  let out=`Best attribute: ${tag(m.at)} <b>${esc(ba)}</b>. `;
  if(!m.fm.length)out+='No fusion upgrades it (it can only be used as an ingredient).';
  else{out+=`Best fusion: ${tag(m.ft)} ${top.map(f=>`<b>${esc(f.en)}</b> (with ${f.sub.spell?esc(f.sub.spell.en):esc(f.sub.passive)})`).join(', ')}.`;
    if(topU.length&&rank(m.ut)<rank(m.ft))out+=` Its Ultima is better: ${tag(m.ut)} <b>${esc(topU[0].ult.en)}</b>.`;
    else if(topU.length)out+=` Best Ultima: ${tag(m.ut)} <b>${esc(topU.map(f=>f.ult.en).join(', '))}</b>.`;
    if(rank(m.at)<rank(m.ft))out+=' → The attribute alone beats its fusions: pick it for the attribute.';
    else if(rank(m.ft)<rank(m.at))out+=' → Worth taking mainly for the fusion.';}
  return out;
}
function fusionLi(f,role){
  const other=role==='main'?f.sub:f.main;const v=mode==='dem'?f.var.dem:f.var.std;
  return `<li><div class="row">${fImg(f,'sm')}<div class="body"><div class="ttl">${tag(T(f))} ${esc(f.en)}</div>
  <div class="fx">${role==='main'?'+ ':'Upgrades '}${refHTML(other)}${role==='sub'?` <span class="sub">— this spell is consumed</span>`:''}</div>
  ${f.desc?`<div class="desc">${esc(f.desc)}</div>`:''}${v?`<div class="note">${esc(v)}</div>`:''}${f.note?`<div class="note">${esc(f.note)}</div>`:''}
  ${f.ult&&role==='main'?`<div class="ult"><span class="lbl">Ultima</span>${tag(T(f.ult))} <b>${esc(f.ult.en)}</b><div class="desc">${esc(f.ult.desc)}</div></div>`:''}</div></div></li>`;
}
function viewSpell(id){
  const s=SP[id];if(!s){location.hash='#/';return}
  const main=asMain(s),sub=asSub(s).sort((a,b)=>rank(T(a))-rank(T(b)));
  const attrBlock=a=>{const fs=main.filter(f=>f.main.attr===a).sort((x,y)=>rank(T(x))-rank(T(y)));
    return `<li class="attr"><div class="row">${tag(a.tier,1)}<div class="body"><div class="ttl">${esc(a.en)}<span class="sub">${a.stage?` · Lv${a.stage}`:''}${a.alias?` · aka ${esc(a.alias)}`:''}</span></div><div class="desc">${esc(a.desc)}</div></div></div>
    ${fs.length?`<ul class="kids">${fs.map(f=>fusionLi(f,'main')).join('')}</ul>`:'<div class="none" style="margin-left:46px">No fusion uses this attribute as the primary spell.</div>'}</li>`};
  const extra=main.filter(f=>!f.main.attr);
  app.innerHTML=`<a class="back" href="#/">← All spells</a>
  <div class="head">${sImg(s,'lg')}<h1>${esc(s.en)}</h1><span class="el" style="${elv(s)}" title="${EL[s.el]}"></span><span class="sub">${EL[s.el]}</span><span style="margin-left:auto">${modeSeg()}</span></div>
  <div class="verdict">${verdict(s)}</div>
  <div class="meta"><div><b>Level-ups</b> (Lv2–6): ${esc(s.lv)}</div>${s.ench?`<div><b>Enchant</b>: ${esc(s.ench)}</div>`:''}<div><b>Artifacts</b>: ${s.art.length?esc(s.art.join(', ')):'none'}</div>${s.note?`<div>${esc(s.note)}</div>`:''}</div>
  <h2>Attributes → fusions → Ultimas</h2>
  <p class="note" style="margin:0">A fusion needs <b>this exact attribute</b> on ${esc(s.en)} plus the partner spell with its listed attribute. ${esc(s.en)} is the primary spell: it gets the boost and keeps its artifacts; the partner is consumed.</p>
  <ul class="tree">${s.attrs.map(attrBlock).join('')}</ul>
  ${extra.length?`<ul class="tree"><li class="attr"><div class="ttl">Other</div><ul class="kids">${extra.map(f=>fusionLi(f,'main')).join('')}</ul></li></ul>`:''}
  <h2>Used as an ingredient</h2>
  ${sub.length?`<ul class="tree"><li class="attr"><ul class="kids" style="margin-top:0">${sub.map(f=>fusionLi(f,'sub')).join('')}</ul></li></ul>`:'<p class="none">Never used as an ingredient.</p>'}`;
}
let tab='fusions';try{tab=sessionStorage.getItem('ms-tab')||'fusions'}catch(e){}
function viewTiers(){
  const tabs={attrs:'Attributes',fusions:'Fusions',ults:'Ultimas',passives:'Special passives'};
  let items=[];
  if(tab==='attrs')items=SPELLS.flatMap(s=>s.attrs.map(a=>({t:a.tier,en:a.en,sub:s.en,href:'#/spell/'+s.id,el:s.el,ic:sImg(s,'sm')})));
  if(tab==='fusions')items=FUS.map(f=>({t:T(f),en:f.en,sub:f.main.fusion?'Overmind + all passives':`${f.main.spell.en} + ${f.sub.spell?f.sub.spell.en:f.sub.passive}`,href:'#/spell/'+f.main.spell.id,el:f.main.spell.el,ic:fImg(f,'sm')}));
  if(tab==='ults')items=ULT.map(u=>({t:T(u),en:u.en,sub:`from ${u.fusion.en}`,href:'#/spell/'+u.fusion.main.spell.id,el:u.fusion.main.spell.el,ic:fImg(u.fusion,'sm')}));
  if(tab==='passives')items=PASSIVES.special.map(p=>({t:p[1],en:p[0],sub:p[2],href:'#/passives',el:'support',ic:pImg(p[0],'sm')}));
  const hasMode=tab==='fusions'||tab==='ults';
  const rows=[...ORDER,null].map(t=>{const its=items.filter(i=>i.t===t);if(!its.length)return'';return `<div class="tierrow">${tag(t,1)}<div class="chips">${its.map(i=>`<a class="chip" style="--el:var(--${i.el})" href="${i.href}">${i.ic}<span>${esc(i.en)}<small>${esc(i.sub)}</small></span></a>`).join('')}</div></div>`}).join('');
  app.innerHTML=`<div class="bar"><span class="seg" role="tablist">${Object.entries(tabs).map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${v}</button>`).join('')}</span>${hasMode?`<label>Tiers ${modeSeg()}</label>`:''}</div>
  <p class="note" style="margin:0 0 6px">${tab==='attrs'?'Attribute tiers ignore fusions: how good the spell is on its own with that attribute.':tab==='passives'?'Special passives show up at fixed levels each run (also from the Unicorn artifact).':tab==='ults'?'Ultimas show the icon of the fusion they upgrade.':mode==='dem'?'Tiers when running Deus Ex Machina. Fusions marked – are not rated in that list.':'Standard tiers. × means worse than E.'}</p>${rows}`;
}
function viewPassives(){
  const tbl=(rows,h)=>`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
  const nm=n=>`<span class="lnk">${pImg(n,'sm')}<b>${esc(n)}</b></span>`;
  app.innerHTML=`<h2>Special passives</h2><p class="note">Offered at fixed levels in each run, up to a dozen or so times. Not offered when taking the Mana option.</p>
  ${tbl([...PASSIVES.special].sort((a,b)=>rank(a[1])-rank(b[1])).map(p=>`<tr><td>${tag(p[1])}</td><td>${nm(p[0])}</td><td>${esc(p[2])}</td></tr>`),['Tier','Name','Effect'])}
  <h2>Regular passives</h2><p class="note">No tier: their value depends on your fusions.</p>
  ${tbl(PASSIVES.regular.map(p=>`<tr><td>${nm(p[0])}</td><td>${p[1]}</td><td>${esc(p[2])}</td></tr>`),['Name','Max Lv','Effect'])}
  <h2>Growth passives</h2><p class="note">Only offered once you reach max level; up to 50 levels in total.</p>
  ${tbl(PASSIVES.growth.map(p=>`<tr><td><b>${esc(p[0])}</b></td><td>${p[1]}</td><td>${esc(p[2])}</td></tr>`),['Name','Max Lv','Effect'])}`;
}
function viewAbout(){
  app.innerHTML=`<div class="prose"><h2>How it works</h2>
  <p>Attack spells max out at <b>Lv7</b>, utility spells at <b>Lv5</b>; at max level you pick <b>one of three attributes</b>. Magic Bolt is special: it gets one attribute at Lv4 and another at Lv7.</p>
  <p>A <b>fusion</b> (Magic Combination) merges two max-level spells, each with a specific attribute. The <b>primary</b> spell gets the boost and keeps its artifacts; the <b>secondary</b> is consumed, and its artifacts stop helping. You get a fusion slot at character Lv25, 50 and 75.</p>
  <p>An <b>Ultima</b> is a much stronger version of a fusion, unlocked by clearing cities. It triggers when your Subject reaches <b>Lv100</b> while you have the matching Class and the fusion; it then replaces the fusion. Level 100 is spent on it.</p>
  <h2>Tiers</h2>
  <p>Tiers come from atomon's tier list (game version 0.981). They rate how much a spell helps you <b>survive long runs</b>, assuming a build around the Cosmos or Ascension Ultima. They are one player's opinion: a low tier doesn't mean the spell can't go past 40 minutes on Terra (Hard). × means worse than E.</p>
  <p><b>Standard</b> is the normal ranking. <b>Deus Ex Machina</b> rates the same fusions for a run ending with Deus Ex Machina (Overmind, then a 3rd fusion), where the ranking changes a lot. Attribute tiers ignore fusions.</p>
  <h2>Names and descriptions</h2>
  <p>Names, icons, and attribute and fusion descriptions follow the <a href="https://magic-survival-rpg.fandom.com/wiki/Magic_Combination">Magic Survival Fandom wiki</a>. Some of its numbers date from v0.956. The wiki is inconsistent about a few attribute names; the other spelling stays searchable as “aka”. Glacium, Soul Blade and Discharge, and the Ultimas, are newer than the wiki: their names may differ slightly in game, and the three fusions have no description or icon yet.</p></div>`;
}
// ---------- ROUTER ----------
function route(){
  const h=location.hash.replace(/^#\/?/,'');const[k,id]=h.split('/');
  const key=k==='spell'?'spells':(k||'spells');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===key));
  window.scrollTo(0,0);
  if(k==='spell')viewSpell(id);else if(k==='tiers')viewTiers();else if(k==='passives')viewPassives();else if(k==='about')viewAbout();else viewSpells();
}
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;try{localStorage.setItem('ms-mode',mode)}catch(_){}const y=scrollY;route();scrollTo(0,y);return}
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;try{sessionStorage.setItem('ms-tab',tab)}catch(_){}route()}
});
addEventListener('hashchange',route);route();
</script></body></html>
