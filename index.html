<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14121c">
<title>Magic Survival · Spells & fusions</title>
<meta name="description" content="Magic Survival companion: spell attributes, fusions and ultimates with tiers, in English.">
<style>
:root{color-scheme:dark;--bg:#14121c;--panel:#1d1a29;--panel2:#252135;--line:#3a3450;--muted:#a9a3bf;--ink:#f1eef9;--accent:#b99cff;
--tS:#ff6b6b;--tA:#ff9f43;--tB:#ffd166;--tC:#7bd88f;--tD:#6cb6ff;--tE:#8b87a0;--tX:#5a5470;
--fire:#ff8a5c;--storm:#ffd84d;--nature:#6fd6ff;--energy:#c792ff;--arcane:#f2f2f2;--support:#8be0b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent);text-underline-offset:3px}
button,input{font:inherit;color:inherit}
.shell{max-width:1200px;margin:auto;padding:0 20px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:20px;letter-spacing:.5px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand small{font-weight:500;color:var(--muted);font-size:14px;margin-left:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted)}
nav a.on{background:var(--panel2);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 11px;cursor:pointer;color:var(--muted);font-size:14px}
.seg button.on{background:var(--accent);color:#1a1426;font-weight:700}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 0}
.bar label{color:var(--muted);font-size:14px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
h2{font-size:15px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:26px 0 10px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--el);border-radius:10px;padding:11px 13px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);border-left-color:var(--el);transform:translateY(-1px)}
.card .nm{font-weight:700;font-size:17px}
.card .jp{color:var(--muted);font-size:13px;margin-left:6px;font-weight:400}
.sum{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.sum span{display:inline-flex;align-items:center;gap:5px}
.t{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 5px;border-radius:5px;font-weight:800;font-size:13px;color:#16121f;background:var(--tE)}
.t.S{background:var(--tS)}.t.A{background:var(--tA)}.t.B{background:var(--tB)}.t.C{background:var(--tC)}.t.D{background:var(--tD)}.t.E{background:var(--tE)}.t.X{background:var(--tX);color:#fff}.t.N{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.t.big{min-width:34px;height:30px;font-size:17px;border-radius:7px}
.el{width:10px;height:10px;border-radius:50%;background:var(--el);display:inline-block}
/* detail */
.back{display:inline-block;margin:16px 0 0;color:var(--muted);text-decoration:none}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:10px 0 4px}
.head h1{margin:0;font-size:30px}
.head .jp{color:var(--muted)}
.verdict{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin:12px 0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 18px;font-size:14px;color:var(--muted);margin:10px 0}
.meta b{color:var(--ink);font-weight:600}
.tree{list-style:none;margin:0;padding:0}
.attr{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:flex-start}
.row .body{flex:1;min-width:0}
.ttl{font-weight:700}
.ttl .jp{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.desc{color:var(--muted);font-size:14px;margin-top:2px}
.kids{list-style:none;margin:10px 0 0 13px;padding:0 0 0 18px;border-left:2px solid var(--line)}
.kids>li{position:relative;padding:8px 0}
.kids>li::before{content:"";position:absolute;left:-18px;top:20px;width:14px;border-top:2px solid var(--line)}
.fx{color:var(--muted);font-size:14px}
.fx a{font-weight:600}
.ult{margin-top:6px;padding:7px 10px;background:var(--panel2);border-radius:8px;font-size:14px}
.ult .lbl{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-right:6px}
.note{font-size:13px;color:var(--muted);font-style:italic}
.none{color:var(--muted);font-size:14px;padding:4px 0}
details{margin-top:4px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
/* tier list */
.tierrow{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;border-bottom:1px solid var(--line);padding:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--el);border-radius:8px;padding:5px 10px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.3}
.chip:hover{border-color:var(--accent);border-left-color:var(--el)}
.chip small{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.prose{max-width:760px;color:var(--muted)}
.prose b{color:var(--ink)}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
@media (max-width:600px){.shell{padding:0 14px 40px}.head h1{font-size:24px}.kids{margin-left:6px;padding-left:14px}.kids>li::before{left:-14px;width:10px}}
</style></head>

// ---------- MODEL ----------
const ORDER=['S','A','B','C','D','E','X'];
const rank=t=>t==null?99:ORDER.indexOf(t);
const best=arr=>arr.filter(t=>t!=null).sort((a,b)=>rank(a)-rank(b))[0]||null;
const SP={};SPELLS.forEach(s=>{SP[s.id]=s;s.attrs=s.attrs.map(a=>({id:a[0],en:a[1],jp:a[2],tier:a[3],desc:a[4],stage:a[5]||0,alias:a[6]||'',spell:s}));s.A={};s.attrs.forEach(a=>s.A[a.id]=a)});
const FU={};
const ref=r=>{if(r.startsWith('passive:'))return{passive:r.slice(8)};if(r.startsWith('fusion:'))return{fusion:r.slice(7),spell:SP.circle,attr:null};const[s,a]=r.split('.');return{spell:SP[s],attr:SP[s].A[a]}};
const FUS=FUSIONS.map(f=>({id:f[0],en:f[1],jp:f[2],tier:f[3],dem:f[4],main:ref(f[5]),sub:ref(f[6]),desc:f[7],note:f[8]||'',var:f[9]||{}}));
FUS.forEach(f=>FU[f.id]=f);
const ULT=ULTS.map(u=>({en:u[0],jp:u[1],tier:u[2],dem:u[3],fusion:FU[u[4]],desc:u[5]}));
ULT.forEach(u=>u.fusion.ult=u);

let mode='std';try{mode=localStorage.getItem('ms-mode')||'std'}catch(e){}
const T=x=>mode==='dem'&&x.dem!==undefined?x.dem:x.tier;
const tag=(t,big)=>t==null?`<span class="t N${big?' big':''}" title="Not rated in this list">–</span>`:`<span class="t ${t}${big?' big':''}">${t==='X'?'×':t}</span>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const elv=s=>`--el:var(--${s.el})`;
const spellLink=(s,a)=>`<a href="#/spell/${s.id}">${esc(s.en)}</a>${a?` <span class="note" style="font-style:normal">(${esc(a.en)})</span>`:''}`;
const refHTML=r=>r.fusion?`<b>${esc(FU[r.fusion].en)}</b>`:r.spell?spellLink(r.spell,r.attr):`<b>${esc(r.passive)}</b> <span class="note" style="font-style:normal">(passive)</span>`;
const asMain=s=>FUS.filter(f=>f.main.spell===s);
const asSub=s=>FUS.filter(f=>f.sub.spell===s);
function summary(s){const at=best(s.attrs.map(a=>a.tier));const fm=asMain(s);const ft=best(fm.map(T));const ut=best(fm.filter(f=>f.ult).map(f=>T(f.ult)));return{at,ft,ut,fm}}

// ---------- VIEWS ----------
const app=document.getElementById('app');
function modeSeg(){return `<span class="seg" role="group" aria-label="Tier list"><button data-mode="std" class="${mode==='std'?'on':''}">Standard</button><button data-mode="dem" class="${mode==='dem'?'on':''}">Deus Ex Machina</button></span>`}
let q='';
function viewSpells(){
  const groups=['arcane','fire','storm','nature','energy','support'];
  const match=s=>{if(!q)return true;const n=q.toLowerCase();return [s.en,s.jp,...s.attrs.flatMap(a=>[a.en,a.jp,a.alias]),...asMain(s).flatMap(f=>[f.en,f.jp,f.ult?f.ult.en:''])].some(x=>x&&x.toLowerCase().includes(n))};
  app.innerHTML=`<div class="bar"><label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Spell, attribute, fusion or ultimate (EN / 日本語)" value="${esc(q)}" autocomplete="off"></label><label>Fusion tiers ${modeSeg()}</label></div>
  <p class="note" style="margin:0">Offered a spell? Open it to see its attributes, the fusions it powers up, and the ultimates behind them. Badges: best <b>attribute</b> · best <b>fusion</b> · best <b>ultimate</b>.</p>
  <div id="list"></div>`;
  const list=document.getElementById('list');
  const draw=()=>{list.innerHTML=groups.map(g=>{const ss=SPELLS.filter(s=>s.el===g&&match(s));if(!ss.length)return'';return `<h2>${EL[g]}</h2><div class="grid">${ss.map(s=>{const m=summary(s);return `<a class="card" style="${elv(s)}" href="#/spell/${s.id}"><span class="nm">${esc(s.en)}</span><span class="jp">${s.jp}</span><div class="sum"><span>Attr ${tag(m.at)}</span><span>Fusion ${m.fm.length?tag(m.ft):'<span class="note">none</span>'}</span>${m.fm.some(f=>f.ult)?`<span>Ult ${tag(m.ut)}</span>`:''}</div></a>`}).join('')}</div>`}).join('')||'<p class="none">No match.</p>'};
  draw();
  const qi=document.getElementById('q');qi.addEventListener('input',()=>{q=qi.value.trim();draw()});
}
function verdict(s){
  const m=summary(s);const ba=s.attrs.filter(a=>a.tier===m.at).map(a=>a.en).join(' / ');
  const top=m.fm.filter(f=>T(f)===m.ft);const topU=m.fm.filter(f=>f.ult&&T(f.ult)===m.ut);
  let out=`Best attribute: ${tag(m.at)} <b>${esc(ba)}</b>. `;
  if(!m.fm.length)out+='It never gets upgraded by a fusion (it can only be used as an ingredient).';
  else{out+=`Best fusion: ${tag(m.ft)} ${top.map(f=>`<b>${esc(f.en)}</b> (with ${f.sub.spell?esc(f.sub.spell.en):esc(f.sub.passive||'Overmind')})`).join(', ')}.`;
    if(topU.length&&rank(m.ut)<rank(m.ft))out+=` Its ultimate is better: ${tag(m.ut)} <b>${esc(topU[0].ult.en)}</b>.`;
    else if(topU.length)out+=` Best ultimate: ${tag(m.ut)} <b>${esc(topU.map(f=>f.ult.en).join(', '))}</b>.`;
    if(rank(m.at)<rank(m.ft))out+=' → The attribute alone beats its fusions: pick it for the attribute.';
    else if(rank(m.ft)<rank(m.at))out+=' → Worth taking mainly for the fusion.';}
  return out;
}
function fusionLi(f,role){
  const other=role==='main'?f.sub:f.main;const v=mode==='dem'?f.var.dem:f.var.std;
  return `<li><div class="row">${tag(T(f))}<div class="body"><div class="ttl">${esc(f.en)}<span class="jp">${f.jp}</span></div>
  <div class="fx">${role==='main'?'+ ':'Upgrades '}${refHTML(other)}${role==='sub'?` <span class="note" style="font-style:normal">— this spell is consumed</span>`:''}</div>
  ${f.desc?`<div class="desc">${esc(f.desc)}</div>`:''}${v?`<div class="note">${esc(v)}</div>`:''}${f.note?`<div class="note">${esc(f.note)}</div>`:''}
  ${f.ult&&role==='main'?`<div class="ult"><span class="lbl">Ultimate</span>${tag(T(f.ult))} <b>${esc(f.ult.en)}</b> <span class="jp note" style="font-style:normal">${f.ult.jp}</span><div class="desc">${esc(f.ult.desc)}</div></div>`:''}</div></div></li>`;
}
function viewSpell(id){
  const s=SP[id];if(!s){location.hash='#/';return}
  const main=asMain(s),sub=asSub(s).sort((a,b)=>rank(T(a))-rank(T(b)));
  const attrBlock=a=>{const fs=main.filter(f=>f.main.attr===a).sort((x,y)=>rank(T(x))-rank(T(y)));
    return `<li class="attr"><div class="row">${tag(a.tier,1)}<div class="body"><div class="ttl">${esc(a.en)}<span class="jp">${a.jp}${a.stage?` · Lv${a.stage}`:''}${a.alias?` · aka ${esc(a.alias)}`:''}</span></div><div class="desc">${esc(a.desc)}</div></div></div>
    ${fs.length?`<ul class="kids">${fs.map(f=>fusionLi(f,'main')).join('')}</ul>`:'<div class="none" style="margin-left:46px">No fusion upgrades this attribute.</div>'}</li>`};
  const extra=main.filter(f=>!f.main.attr);
  app.innerHTML=`<a class="back" href="#/">← All spells</a>
  <div class="head"><span class="el" style="${elv(s)}"></span><h1>${esc(s.en)}</h1><span class="jp">${s.jp}</span><span style="margin-left:auto">${modeSeg()}</span></div>
  <div class="verdict">${verdict(s)}</div>
  <div class="meta"><div><b>Level-ups</b> (Lv2–6): ${esc(s.lv)}</div>${s.ench?`<div><b>Enchant</b>: ${esc(s.ench)}</div>`:''}<div><b>Artifacts</b>: ${s.art.length?esc(s.art.join(', ')):'none'}</div>${s.note?`<div>${esc(s.note)}</div>`:''}</div>
  <h2>Attributes → fusions → ultimates</h2>
  <p class="note" style="margin:0">A fusion needs <b>this exact attribute</b> on ${esc(s.en)} plus the partner spell with its listed attribute. ${esc(s.en)} is the primary spell: it gets the boost and keeps its artifacts; the partner is consumed.</p>
  <ul class="tree">${s.attrs.map(attrBlock).join('')}</ul>
  ${extra.length?`<ul class="tree"><li class="attr"><div class="ttl">Other</div><ul class="kids">${extra.map(f=>fusionLi(f,'main')).join('')}</ul></li></ul>`:''}
  <h2>Used as an ingredient</h2>
  ${sub.length?`<ul class="tree"><li class="attr"><ul class="kids" style="margin-top:0">${sub.map(f=>fusionLi(f,'sub')).join('')}</ul></li></ul>`:'<p class="none">Never used as an ingredient.</p>'}`;
  window.scrollTo(0,0);
}
let tab='fusions';try{tab=sessionStorage.getItem('ms-tab')||'fusions'}catch(e){}
function viewTiers(){
  const tabs={attrs:'Attributes',fusions:'Fusions',ults:'Ultimates',passives:'Special passives'};
  let items=[];
  if(tab==='attrs')items=SPELLS.flatMap(s=>s.attrs.map(a=>({t:a.tier,en:a.en,sub:s.en,href:'#/spell/'+s.id,el:s.el})));
  if(tab==='fusions')items=FUS.map(f=>({t:T(f),en:f.en,sub:f.main.fusion?'Overmind + all passives':`${f.main.spell.en} + ${f.sub.spell?f.sub.spell.en:f.sub.passive}`,href:'#/spell/'+f.main.spell.id,el:f.main.spell.el}));
  if(tab==='ults')items=ULT.map(u=>({t:T(u),en:u.en,sub:`from ${u.fusion.en}`,href:'#/spell/'+u.fusion.main.spell.id,el:u.fusion.main.spell.el}));
  if(tab==='passives')items=PASSIVES.special.map(p=>({t:p[2],en:p[0],sub:p[3],href:'#/passives',el:'support'}));
  const hasMode=tab==='fusions'||tab==='ults';
  const rows=[...ORDER,null].map(t=>{const its=items.filter(i=>i.t===t);if(!its.length)return'';return `<div class="tierrow">${tag(t,1)}<div class="chips">${its.map(i=>`<a class="chip" style="--el:var(--${i.el})" href="${i.href}">${esc(i.en)}<small>${esc(i.sub)}</small></a>`).join('')}</div></div>`}).join('');
  app.innerHTML=`<div class="bar"><span class="seg" role="tablist">${Object.entries(tabs).map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${v}</button>`).join('')}</span>${hasMode?`<label>Tiers ${modeSeg()}</label>`:''}</div>
  <p class="note" style="margin:0 0 6px">${tab==='attrs'?'Attribute tiers ignore fusions: how good the spell is on its own with that attribute.':tab==='passives'?'Special passives show up at fixed levels each run (also from the Unicorn artifact).':mode==='dem'?'Tiers when running Deus Ex Machina. Fusions marked – are not rated in that list.':'Standard tiers. × means worse than E.'}</p>${rows}`;
}
function viewPassives(){
  const tbl=(rows,h)=>`<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
  app.innerHTML=`<h2>Special passives</h2><p class="note">Offered at fixed levels in each run, up to a dozen or so times. Not offered when taking the Mana option.</p>
  ${tbl([...PASSIVES.special].sort((a,b)=>rank(a[2])-rank(b[2])).map(p=>`<tr><td>${tag(p[2])}</td><td><b>${esc(p[0])}</b><br><span class="note" style="font-style:normal">${p[1]}</span></td><td>${esc(p[3])}</td></tr>`),['Tier','Name','Effect'])}
  <h2>Regular passives</h2><p class="note">No tier: their value depends on your fusions.</p>
  ${tbl(PASSIVES.regular.map(p=>`<tr><td><b>${esc(p[0])}</b><br><span class="note" style="font-style:normal">${p[1]}</span></td><td>${p[2]}</td><td>${esc(p[3])}</td></tr>`),['Name','Max Lv','Effect'])}
  <h2>Growth passives</h2><p class="note">Only offered once you reach max level; up to 50 levels in total.</p>
  ${tbl(PASSIVES.growth.map(p=>`<tr><td><b>${esc(p[0])}</b><br><span class="note" style="font-style:normal">${p[1]}</span></td><td>${p[2]}</td><td>${esc(p[3])}</td></tr>`),['Name','Max Lv','Effect'])}`;
}
function viewAbout(){
  app.innerHTML=`<div class="prose"><h2>How it works</h2>
  <p>Attack spells max out at <b>Lv7</b>, utility spells at <b>Lv5</b>; at max level you pick <b>one of three attributes</b>. Magic Bolt is special: it gets one attribute at Lv4 and another at Lv7.</p>
  <p>A <b>fusion</b> combines two max-level spells, each with a specific attribute. The <b>primary</b> spell gets the boost and keeps its artifacts; the <b>secondary</b> is consumed, and its artifacts stop helping. You get a fusion slot at character Lv25, 50 and 75.</p>
  <p>An <b>ultimate</b> is a much stronger version of a fusion. It triggers at Lv100 when you play the fusion's matching Class and Subject. Ultimates unlock by clearing cities.</p>
  <h2>Tiers</h2>
  <p>Tiers come from the Japanese wiki (author: atomon, game version 0.981). They rate how much a spell helps you <b>survive long runs</b>, assuming a build around Cosmos or Ascension. They are one player's opinion. A low tier does not mean the spell can't clear Terra (Hard) past 40 minutes. × means worse than E.</p>
  <p><b>Standard</b> is the normal ranking. <b>Deus Ex Machina</b> rates the same fusions in a run that ends with Deus Ex Machina (Overmind + 3rd fusion), where the ranking changes a lot. Attribute tiers ignore fusions.</p>
  <h2>Translation</h2>
  <p>Japanese names are matched to the official English names from the Fandom wiki. When the two wikis disagree, this site follows the newer Japanese one, and the other name stays searchable as “aka”. Fusion descriptions come from Fandom (v0.956), so some numbers may be out of date. Ultimate descriptions are translated from the Japanese wiki. Glacium, Soul Blade and Discharge are not on Fandom yet.</p>
  <p>Sources: <a href="https://w.atwiki.jp/magicsurvival/pages/15.html">マジサバwiki · 魔法(紹介&amp;tier)</a>, <a href="https://magic-survival-rpg.fandom.com/wiki/Magic_Combination">Fandom · Magic Combination</a>.</p></div>`;
}
// ---------- ROUTER ----------
function route(){
  const h=location.hash.replace(/^#\/?/,'');const[k,id]=h.split('/');
  const key=k==='spell'?'spells':(k||'spells');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===key));
  window.scrollTo(0,0);
  if(k==='spell')viewSpell(id);else if(k==='tiers')viewTiers();else if(k==='passives')viewPassives();else if(k==='about')viewAbout();else viewSpells();
}
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;try{localStorage.setItem('ms-mode',mode)}catch(_){}route();return}
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;try{sessionStorage.setItem('ms-tab',tab)}catch(_){}route()}
});
addEventListener('hashchange',route);route();
</script></body></html>
