# Publie le site sur GitHub Pages à chaque push sur main (ou à la demande depuis l'onglet Actions).
# Réglage côté GitHub : Settings → Pages → Source : « GitHub Actions ».
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pas de build : on publie uniquement la page et ses icônes.
      - run: mkdir -p _site && cp -r index.html img _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
